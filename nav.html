<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margshirsh | Navigation OS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@300;500;700&display=swap');

        :root {
            --bg-core: #030712;
            --bg-grid: #111827;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent: #8b5cf6; /* Violet */
            --accent-glow: rgba(139, 92, 246, 0.4);
            --text-main: #f9fafb;
            --text-dim: #9ca3af;
            --danger: #f43f5e;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-core);
            background-image: 
                linear-gradient(rgba(139, 92, 246, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(139, 92, 246, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            font-family: 'Outfit', sans-serif;
            color: var(--text-main);
            overflow: hidden;
            display: flex;
        }

        /* --- LAYOUT --- */
        .os-interface {
            display: grid;
            grid-template-columns: 580px 6fr; 
            width: 100%;
            height: 100%;
            padding: 20px;
            gap: 20px;
        }

        /* --- LEFT PANEL: CHAT --- */
        .panel-left {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
        }

        .panel-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-title {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 1px;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent);
        }

        .reset-btn {
            background: transparent;
            border: 1px solid #374151;
            color: #6b7280;
            font-size: 0.7rem;
            font-family: 'JetBrains Mono', monospace;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .reset-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(139, 92, 246, 0.1);
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }

        .chat-history::-webkit-scrollbar { width: 6px; }
        .chat-history::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }

        .msg {
            max-width: 90%;
            font-size: 0.95rem;
            line-height: 1.5;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg.user {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--accent), #6d28d9);
            color: white;
            padding: 12px 16px;
            border-radius: 12px 4px 12px 12px;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .msg.bot {
            align-self: flex-start;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-dim);
            padding: 12px 16px;
            border-radius: 4px 12px 12px 12px;
        }
        
        .msg.bot strong { color: var(--text-main); }

        .input-zone {
            padding: 20px;
            border-top: 1px solid var(--glass-border);
            background: rgba(0,0,0,0.2);
        }

        .chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 15px;
            padding-bottom: 5px;
        }

        .chips::-webkit-scrollbar { height: 0; }

        .chip {
            background: transparent;
            border: 1px solid #374151;
            color: var(--text-dim);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }

        .chip:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(139, 92, 246, 0.1);
        }

        .cmd-input {
            display: flex;
            gap: 10px;
            background: #111827;
            padding: 5px;
            border-radius: 12px;
            border: 1px solid #374151;
        }

        .cmd-input:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 12px;
            font-family: 'Outfit', sans-serif;
            outline: none;
        }

        .send-icon {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            background: var(--accent);
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .send-icon:hover { background: #7c3aed; }

        /* --- RIGHT PANEL: VISUALIZER --- */
        .panel-right {
            background: #000;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            border: 1px solid #1f2937;
            display: flex;
            flex-direction: column;
        }

        .viewport-frame {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 40px;
        }

        .corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid var(--accent);
            transition: 0.3s;
        }
        .tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
        .tr { top: 20px; right: 20px; border-left: none; border-bottom: none; }
        .bl { bottom: 20px; left: 20px; border-right: none; border-top: none; }
        .br { bottom: 20px; right: 20px; border-left: none; border-top: none; }

        .viewport-content {
            width: 100%;
            height: 100%;
            max-width: 100%; 
            max-height: 100%;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            position: relative;
            background: #050505;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #main-display-img {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .scan-line {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: rgba(139, 92, 246, 0.5);
            box-shadow: 0 0 10px var(--accent);
            animation: scan 3s linear infinite;
            display: none;
            z-index: 5;
            pointer-events: none;
        }

        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .empty-state {
            text-align: center;
            color: #4b5563;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .radar-spinner {
            position: relative;
            width: 80px;
            height: 80px;
            margin-bottom: 25px;
            border: 1px dashed #374151;
            border-radius: 50%;
            animation: spin 10s linear infinite;
        }
        
        .radar-spinner::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 4px; height: 4px;
            background: var(--accent);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px var(--accent);
        }

        .radar-line {
            position: absolute;
            top: 0; left: 50%;
            width: 1px;
            height: 50%;
            background: linear-gradient(to bottom, var(--accent), transparent);
            transform-origin: bottom center;
            animation: radar 2s ease-in-out infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes radar {
            0% { transform: rotate(0deg); opacity: 1; }
            50% { transform: rotate(180deg); opacity: 0.5; }
            100% { transform: rotate(360deg); opacity: 1; }
        }

        .empty-state h3 {
            font-weight: 700;
            letter-spacing: 4px;
            margin: 0;
            font-size: 1rem;
            color: #6b7280;
            text-transform: uppercase;
        }

        .empty-state p {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: #4b5563;
            margin-top: 5px;
        }

        .overlay-ui {
            position: absolute;
            top: 40px; right: 40px;
            text-align: right;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--accent);
            opacity: 0.7;
            pointer-events: none;
            z-index: 10;
        }

        .overlay-ui span { display: block; margin-bottom: 5px; }

        @media (max-width: 900px) {
            .os-interface { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
            .panel-right { order: -1; }
        }

    </style>
</head>
<body>

    <div class="os-interface">
        
        <!-- LEFT: COMMAND & CHAT -->
        <div class="panel-left">
            <div class="panel-header">
                <div class="brand-title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                    </svg>
                    MARGSHIRSH
                </div>
                <button id="reset-btn" class="reset-btn">RESET</button>
            </div>

            <div class="chat-history" id="chat-history">
                <div class="msg bot">
                    System initialized. Accessing campus database.<br><br>
                    Please specify a location to render visual data.
                </div>
            </div>

            <div class="input-zone">
                <div class="chips">
                    <!-- UPDATED BUTTONS TO MATCH NEW NAMES -->
                    <button class="chip" onclick="sendCmd('Library')">Library</button>
                    <button class="chip" onclick="sendCmd('Biology')">Biology</button>
                    <button class="chip" onclick="sendCmd('Physics')">Physics</button>
                    <button class="chip" onclick="sendCmd('Chemistry')">Chemistry</button>
                    <button class="chip" onclick="sendCmd('Computer')">Computer</button>
                    <button class="chip" onclick="sendCmd('Auditorium')">Auditorium</button>
                </div>
                <div class="cmd-input">
                    <input type="text" id="user-input" placeholder="Enter command..." autocomplete="off">
                    <button class="send-icon" id="send-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M5 12h14M12 5l7 7-7 7"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- RIGHT: VISUALIZER VIEWPORT -->
        <div class="panel-right">
            <div class="overlay-ui">
                <span>VIEWPORT_ACTIVE: <b id="view-status">OFFLINE</b></span>
                <span>SIGNAL: <b>100%</b></span>
                <span>COORDS: <span id="coords">00.00, 00.00</span></span>
            </div>

            <div class="corner tl"></div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
            <div class="corner br"></div>

            <div class="viewport-frame">
                <div class="viewport-content">
                    <div class="scan-line" id="scan-line"></div>
                    
                    <div class="empty-state" id="empty-state">
                        <div class="radar-spinner">
                            <div class="radar-line"></div>
                        </div>
                        <h3>System Standby</h3>
                        <p>Waiting for command...</p>
                    </div>

                    <img id="main-display-img" src="" alt="Visual Output">
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        // UPDATED LIST TO MATCH REQUESTED NAMES
        const places = [
            "Library", "Biology", "Physics", 
            "Chemistry", "Computer", "Auditorium"
        ];

        // --- DOM ELEMENTS ---
        const chatHistory = document.getElementById('chat-history');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const resetBtn = document.getElementById('reset-btn');
        
        const mainImg = document.getElementById('main-display-img');
        const emptyState = document.getElementById('empty-state');
        const viewStatus = document.getElementById('view-status');
        const scanLine = document.getElementById('scan-line');
        const coords = document.getElementById('coords');

        // --- CORE LOGIC ---

        function sendCmd(text) {
            userInput.value = text;
            handleSend();
        }

        function handleSend() {
            const input = userInput.value.trim();
            if (!input) return;

            addMessage(input, 'user');
            userInput.value = '';

            setTimeout(() => {
                processCommand(input);
            }, 600);
        }

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            div.innerHTML = text;
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function processCommand(input) {
            const lowerInput = input.toLowerCase();
            
            // Logic: Find Place
            const match = places.find(p => lowerInput.includes(p.toLowerCase()));

            if (match) {
                addMessage(`Rendering data for <strong>${match}</strong>...`, 'bot');
                updateViewport(match);
            } else {
                addMessage(`Location "${input}" not found in database.`, 'bot');
                resetViewport();
            }
        }

        // --- VIEWPORT CONTROLLER ---

        function updateViewport(placeName) {
            // Logic constructs filename: e.g., "Biology.png"
            const imgSrc = `${placeName}.png`;

            emptyState.style.display = 'none';
            mainImg.style.opacity = '0';
            mainImg.style.display = 'block';

            viewStatus.textContent = "ONLINE";
            viewStatus.style.color = "#4ade80"; 
            scanLine.style.display = 'block';
            
            mainImg.src = imgSrc;

            mainImg.onload = () => {
                mainImg.style.opacity = '1';
                coords.textContent = `${(Math.random()*90).toFixed(2)}, ${(Math.random()*180).toFixed(2)}`;
            };

            mainImg.onerror = () => {
                mainImg.style.display = 'none';
                emptyState.style.display = 'flex';
                emptyState.innerHTML = `
                    <div style="color:#f43f5e; font-size:40px; margin-bottom:20px;">!</div>
                    <h3 style="color:#f43f5e;">DATA MISSING</h3>
                    <p>File "${imgSrc}" not found</p>
                `;
                viewStatus.textContent = "ERROR";
                viewStatus.style.color = "#f43f5e"; 
                scanLine.style.display = 'none';
            };
        }

        function resetViewport() {
            emptyState.style.display = 'flex';
            emptyState.innerHTML = `
                <div class="radar-spinner">
                    <div class="radar-line"></div>
                </div>
                <h3>System Standby</h3>
                <p>Waiting for command...</p>
            `;
            
            mainImg.style.display = 'none';
            viewStatus.textContent = "STANDBY";
            viewStatus.style.color = "#8b5cf6"; 
            scanLine.style.display = 'none';
        }

        function resetSystem() {
            chatHistory.innerHTML = '';
            addMessage('System reset. Awaiting input.', 'bot');
            resetViewport();
        }

        // --- EVENTS ---
        sendBtn.addEventListener('click', handleSend);
        resetBtn.addEventListener('click', resetSystem);
        
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });

    </script>
</body>
</html>
